name: Testar cupons das lojas

# Mostra, no log, os cupons que cada loja de stores.json publica. Não envia nada no Telegram.
on:
  workflow_dispatch: {}

jobs:
  cupons:
    runs-on: ubuntu-24.04   # fixo: o 'latest' está migrando para outra versão e pode quebrar a instalação do Chromium
    timeout-minutes: 25
    env:
      DB_PATH: teste.db
      LOG_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          for i in 1 2 3; do
            pip install -r requirements.txt && playwright install --with-deps chromium && break
            echo "Tentativa $i de instalar falhou; esperando para repetir..."; sleep 20
            [ "$i" = 3 ] && exit 1
          done
      - name: Ler cupons de cada loja
        run: python main.py --stores-test
