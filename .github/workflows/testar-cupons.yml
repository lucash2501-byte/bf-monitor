name: Testar cupons das lojas

# Mostra, no log, os cupons que cada loja de stores.json publica. Não envia nada no Telegram.
on:
  workflow_dispatch: {}

jobs:
  cupons:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PATH: teste.db
      LOG_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Ler cupons de cada loja
        run: python main.py --stores-test
